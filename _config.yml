# Settings de base du site
locale                  : "fr-FR"
site_theme              : "default"
title                   : "Pierre-Jean Lapray"
title_separator         : "-"
name                    : &name "Pierre-Jean Lapray"
description             : &description "Page de Recherche"
url                     : "https://pjlapray.github.io"
baseurl                 : "/rech"
repository              : "pjlapray/rech"

# Barre latérale (Profil Auteur)
author:
  avatar                : "profile.png"
  name                  : "Pierre-Jean Lapray"
  bio                   : "Enseignant-Chercheur — ENSISA / IRIMAS - Université de Haute-Alsace"
  location              : "Mulhouse, France"
  employer              : "Université de Haute-Alsace"
  email                 : "pierre-jean.lapray@uha.fr"
  
  # Liens académiques & réseaux
  googlescholar         : "https://scholar.google.fr/citations?user=Nve-U2AAAAAJ"
  orcid                 : "https://orcid.org/0000-0003-2230-0955"
  github                : "pjlapray" # <-- Remplacez par votre identifiant GitHub

# Catégories de publications
publication_category:
  manuscripts:
    title: 'Articles de Journal'    
  conferences:
    title: 'Conférences'

# Nettoyage de l'interface
breadcrumbs             : false
words_per_minute        : 160
future                  : true
read_more               : "disabled"
talkmap_link            : false

# Masquer le bas de page RSS / Feed
atom_feed:
  hide                  : true

# Analytics & Commentaires désactivés
comments:
  provider              : false
analytics:
  provider              : false

# Fichiers à inclure/exclure
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - CHANGELOG
  - Gemfile
  - LICENSE
  - README
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

# ==========================================
# C'EST CE BLOC QUI MANQUAIT :
# ==========================================
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Réglages par défaut des pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Style CSS
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Paris

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji